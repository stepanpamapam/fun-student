<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fun Student</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <strong class="brand">Fun Student</strong>
    <div class="account" id="account" hidden>
      <span id="identity"></span>
      <button id="logout" class="secondary">Выйти</button>
    </div>
  </header>
  <main>
    <section id="login" class="panel login">
      <h1>Вход в кабинет</h1>
      <form id="login-form">
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
        <button>Войти</button>
        <p id="login-error" role="alert" hidden></p>
      </form>
    </section>
    <section id="dashboard" hidden>
      <nav id="navigation" aria-label="Разделы"></nav>
      <div class="heading">
        <div><h1 id="title"></h1><p id="count" aria-live="polite"></p></div>
        <button id="add">Добавить</button>
      </div>
      <div class="panel directory">
        <label>Поиск<input id="search" type="search"></label>
        <p id="status" role="status" hidden></p>
        <button id="retry" class="secondary" hidden>Повторить</button>
        <ul id="records"></ul>
      </div>
    </section>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form">
      <h2 id="editor-title"></h2>
      <div id="fields"></div>
      <p id="editor-error" role="alert" hidden></p>
      <div class="actions">
        <button type="button" id="close" class="secondary">Закрыть</button>
        <button type="button" id="remove" class="danger" hidden>Удалить</button>
        <button id="save" hidden>Сохранить</button>
      </div>
    </form>
  </dialog>
</body>
</html>
